# ─────────────────────────────────────────────────────────────────
# Backend upstream pool — add/remove instances here.
#
# Algorithm: least_conn
#   Sends each new request to the backend with the fewest
#   active connections. Better than round-robin for APIs with
#   variable processing time (weather API calls vary 50ms–5s).
#
# To scale: add more backend_N entries and corresponding
# services in docker-compose.yml.
# ─────────────────────────────────────────────────────────────────

upstream weathersphere_backend {
    least_conn;

    # Backend instances
    server backend_1:3001 max_fails=3 fail_timeout=15s;
    server backend_2:3001 max_fails=3 fail_timeout=15s;

    # Keep persistent connections to backends
    keepalive 32;
}
