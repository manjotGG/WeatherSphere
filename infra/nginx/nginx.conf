# ─────────────────────────────────────────────────────────────────────
# WeatherSphere — Nginx Load Balancer + WAF Configuration
#
# Architecture:
#   - Reverse proxy distributing traffic to 2+ backend instances
#   - Least-connections load balancing (best for variable latency)
#   - Active health checks via /health/live
#   - Layer 7 WAF rules (block bots, limit body size, method filtering)
#   - Gzip compression for API responses
#   - Rate limiting at Nginx level (first defense layer)
#   - Static file serving for frontend (no Node.js involvement)
# ─────────────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging format ─────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"upstream_addr":"$upstream_addr",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ── Performance ────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 60;
    keepalive_requests 1000;

    # ── Gzip ───────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml;

    # ── Security — request limits ──────────────────────────────────
    # Max body size (prevents large payload attacks)
    client_max_body_size 10k;
    # Header buffer limits (prevents header injection)
    large_client_header_buffers 4 8k;

    # ── Rate Limiting Zones (Nginx layer — first defense) ──────────
    # 10m zone ≈ 160,000 IPs tracked
    # First layer: broad protection before requests hit Node.js
    limit_req_zone $binary_remote_addr zone=api_global:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_burst:10m rate=5r/s;
    limit_req_status 429;

    # ── Upstream Backend Pool ──────────────────────────────────────
    include /etc/nginx/conf.d/upstream.conf;

    # ── Server Block ───────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ── WAF: Block suspicious user agents ──────────────────────
        if ($http_user_agent ~* "(bot|crawl|spider|scraper|curl|wget)") {
            set $block_agent 1;
        }
        # Allow health check tools
        if ($http_user_agent ~* "(Docker-Health-Check|kube-probe)") {
            set $block_agent 0;
        }

        # ── Frontend static files ─────────────────────────────────
        # Served directly by Nginx — never hits Node.js
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Cache static assets aggressively
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                expires 30d;
                add_header Cache-Control "public, immutable";
            }
        }

        # ── API proxy ─────────────────────────────────────────────
        location /api/ {
            # Nginx-level rate limiting (first layer)
            limit_req zone=api_global burst=20 nodelay;
            limit_req zone=api_burst burst=10 nodelay;

            # Only allow GET (our API is read-only)
            limit_except GET {
                deny all;
            }

            # Forward real client IP to backend
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 10s;

            # Retry on failure (try next backend)
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;

            proxy_pass http://weathersphere_backend;
        }

        # ── Health check passthrough ──────────────────────────────
        location /health {
            proxy_pass http://weathersphere_backend;
            proxy_set_header Host $host;

            # No rate limiting on health checks
            access_log off;
        }

        # ── Metrics endpoint (internal only) ──────────────────────
        location /metrics {
            # Restrict to internal networks
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;

            proxy_pass http://weathersphere_backend;
            proxy_set_header Host $host;
        }

        # ── Block common attack paths ─────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* (wp-admin|wp-login|phpmyadmin|admin) {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
