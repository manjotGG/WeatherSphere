# ─────────────────────────────────────────────────────────────────
# Redis Configuration — optimized for rate limiting + caching
#
# Memory policy: allkeys-lru
#   Evicts least-recently-used keys when maxmemory is reached.
#   This is correct for our use case: rate limit windows expire
#   naturally via TTL, and cache entries are expendable.
#
# Persistence: AOF (appendonly)
#   Writes every operation to an append-only log, fsynced every second.
#   On restart, rate limit state is partially recovered. This is
#   acceptable — a few seconds of lost rate limit data won't cause issues.
# ─────────────────────────────────────────────────────────────────

# Bind to all interfaces (within Docker network)
bind 0.0.0.0

# Protected mode off (auth via requirepass, network isolation via Docker)
protected-mode no

# Port
port 6379

# Memory limit
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence — AOF (faster recovery than RDB for our use case)
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Disable RDB (AOF is sufficient)
save ""

# Connection limits
maxclients 1000

# Timeout idle connections after 300s
timeout 300

# TCP keepalive
tcp-keepalive 60

# Logging
loglevel notice
