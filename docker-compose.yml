# ─────────────────────────────────────────────────────────────────
# WeatherSphere — Docker Compose Orchestration
#
# Services:
#   nginx       — Reverse proxy + load balancer + static files
#   backend_1   — Node.js API server (instance 1, port 3001)
#   backend_2   — Node.js API server (instance 2, port 3002)
#   redis       — Shared state (rate limits, cache, circuit breaker)
#
# Architecture:
#   Client → Nginx (port 80) → backend_1 | backend_2 → Redis
#                                    ↓
#                           OpenWeather / Mapbox APIs
#
# Scaling:
#   To add more backend instances, duplicate a backend service
#   block and add its address to infra/nginx/upstream.conf.
#
# Zero-downtime deploy:
#   docker compose up -d --no-deps --build backend_1
#   (wait for health check)
#   docker compose up -d --no-deps --build backend_2
# ─────────────────────────────────────────────────────────────────

services:
  # ── Nginx Load Balancer ──────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: ws_nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/upstream.conf:/etc/nginx/conf.d/upstream.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      backend_1:
        condition: service_healthy
      backend_2:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend_net
      - backend_net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  # ── Backend Instance 1 ──────────────────────────────────────────
  backend_1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ws_backend_1
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - REDIS_KEY_PREFIX=ws:
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - MAPBOX_TOKEN=${MAPBOX_TOKEN}
      - CORS_ORIGINS=http://localhost,http://localhost:80
      - LOG_LEVEL=info
      - UPSTREAM_TIMEOUT_MS=8000
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ── Backend Instance 2 ──────────────────────────────────────────
  backend_2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ws_backend_2
    environment:
      - NODE_ENV=production
      - PORT=3002
      - REDIS_URL=redis://redis:6379
      - REDIS_KEY_PREFIX=ws:
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - MAPBOX_TOKEN=${MAPBOX_TOKEN}
      - CORS_ORIGINS=http://localhost,http://localhost:80
      - LOG_LEVEL=info
      - UPSTREAM_TIMEOUT_MS=8000
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ── Redis ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ws_redis
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          memory: 300M
          cpus: "0.25"

# ── Volumes ────────────────────────────────────────────────────────
volumes:
  redis_data:
    driver: local

# ── Networks ───────────────────────────────────────────────────────
# Two networks isolate the frontend proxy from the backend/Redis tier.
# Nginx bridges both; backends + Redis are on the internal network only.
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true
